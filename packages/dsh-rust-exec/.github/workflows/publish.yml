name: publish

# Publishes dsh-native (unscoped since 1.7.0) to npmjs.com.
# npm never lets a version be overwritten — bump `version` in package.json, tag it,
# and let this run.
#
# Prerequisite: this directory is the root of github.com/keer1024/dsh-native, the
# bundled bin/dsh-rust-worker.exe is committed (the workflow does not build Rust),
# and the repo secret NPM_TOKEN is a Granular Access Token with "Automation" or
# "Bypass 2FA" so `npm publish` works without an OTP prompt.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Tag must match package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Syntax check
        shell: bash
        run: |
          node --check index.js
          node --check client.js

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
